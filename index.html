<!DOCTYPE html>
<html>
<head>
    <title>My Game Library</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background: #222;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
        }

        .games {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 30px;
            justify-content: center;
        }

        .game {
            background: #222;
            width: 180px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .game button {
            background: #444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .game button:hover {
            background: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>🎮 My Game Library</h1>
    <p>Welcome to my game website!</p>
</header>

<div class="games">

    <div class="game">
        <h2>Game 1</h2>
        <p>Coming soon</p>
        <button>Play</button>
    </div>

    <div class="game">
        <h2>Game 2</h2>
        <p>Coming soon</p>
        <button>Play</button>
    </div>

    <div class="game">
        <h2>Game 3</h2>
        <p>Coming soon</p>
        <button>Play</button>
    </div>

</div>

</body>
</html>
